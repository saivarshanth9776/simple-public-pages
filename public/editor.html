<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Page · Simple Pages</title><link rel="stylesheet" href="/style.css"></head><body><main class="app-shell"><header class="app-header"><a class="app-brand" href="/">✦ Simple Pages</a><nav><a class="small-btn" href="/dashboard">← Dashboard</a></nav></header><div class="page-heading"><div><h1>Edit your page</h1><p class="muted">Add a title and paste your text. Publish when you're ready.</p></div></div><div id="message"></div><form id="editorForm" class="card"><label class="field-label" for="title">Page title</label><input class="field" id="title" maxlength="160" placeholder="e.g. College Notice" required><label class="field-label" for="body">Your text</label><textarea class="field editor-text" id="body" maxlength="100000" placeholder="Type or paste your text here…"></textarea><div class="editor-toolbar"><span id="status" class="muted" style="font-size:12px">Draft</span><div class="row-actions"><button type="button" class="small-btn" id="saveBtn">Save draft</button><button type="button" class="small-btn dark" id="publishBtn">Publish page ↗</button></div></div><div id="publicLinkBox" hidden><label class="field-label">Public page link</label><div class="copyline"><input class="field" id="publicLink" readonly><button type="button" class="small-btn" id="copyBtn">Copy link</button><a class="small-btn" id="openBtn" target="_blank" rel="noopener">Open ↗</a></div></div></form><p class="muted" style="font-size:12px">Anyone with access to this dashboard can edit or delete pages. Only publish text you want to make public.</p></main><script src="/editor.js"></script></body></html>
